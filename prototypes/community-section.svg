<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 500" width="1400" height="500">
  <defs>
    <linearGradient id="commBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a1f"/>
      <stop offset="100%" style="stop-color:#0f0f12"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1400" height="500" fill="url(#commBg)"/>

  <!-- Section Header -->
  <g transform="translate(80, 80)">
    <text fill="#ff6b35" font-family="Geist, sans-serif" font-weight="900" font-size="64">COMMUNITY</text>
    <text x="450" y="0" fill="#555" font-family="Geist, sans-serif" font-size="24" font-style="italic">join the conversation</text>
    <line x1="0" y1="30" x2="1240" y2="30" stroke="#333" stroke-width="1"/>
  </g>

  <!-- Telegram Channels (3 columns) -->
  <g transform="translate(80, 160)">

    <!-- Channel 1: Tool Building Ape -->
    <g transform="translate(0, 0)">
      <rect width="400" height="220" fill="none" stroke="#333" stroke-width="1"/>

      <!-- Telegram icon -->
      <g transform="translate(30, 30)">
        <circle r="24" fill="#ff6b35"/>
        <path d="M-8 2l-4 12c.5 0 .7-.2.9-.5l2.5-2.4 5.2 3.8c1 .5 1.6.3 1.9-.9l3.4-15.5c.3-1.4-.5-2-1.5-1.6l-20 7.7c-1.4.5-1.4 1.3-.2 1.6l5.1 1.6 11.8-7.4c.6-.4 1.1-.2.7.2" fill="#1a1a1f" transform="scale(0.8)"/>
      </g>

      <!-- Channel name -->
      <text x="30" y="100" fill="#fff" font-family="Geist, sans-serif" font-weight="700" font-size="24">@toolusing</text>
      <text x="30" y="125" fill="#ff6b35" font-family="Geist Mono, monospace" font-size="14">Tool Building Ape</text>

      <!-- Description -->
      <text x="30" y="160" fill="#888" font-family="Geist, sans-serif" font-size="14">AI tools, coding agents, vibe coding.</text>
      <text x="30" y="180" fill="#888" font-family="Geist, sans-serif" font-size="14">How tools make us human.</text>

      <!-- Stats -->
      <text x="30" y="210" fill="#555" font-family="Geist Mono, monospace" font-size="12">~1,800 subscribers</text>

      <!-- Join arrow -->
      <text x="350" y="200" fill="#ff6b35" font-family="Geist, sans-serif" font-size="24">→</text>
    </g>

    <!-- Channel 2: Experimentally -->
    <g transform="translate(420, 0)">
      <rect width="400" height="220" fill="none" stroke="#333" stroke-width="1"/>

      <g transform="translate(30, 30)">
        <circle r="24" fill="#ff6b35"/>
        <path d="M-8 2l-4 12c.5 0 .7-.2.9-.5l2.5-2.4 5.2 3.8c1 .5 1.6.3 1.9-.9l3.4-15.5c.3-1.4-.5-2-1.5-1.6l-20 7.7c-1.4.5-1.4 1.3-.2 1.6l5.1 1.6 11.8-7.4c.6-.4 1.1-.2.7.2" fill="#1a1a1f" transform="scale(0.8)"/>
      </g>

      <text x="30" y="100" fill="#fff" font-family="Geist, sans-serif" font-weight="700" font-size="24">@experimentally</text>
      <text x="30" y="125" fill="#ff6b35" font-family="Geist Mono, monospace" font-size="14">Опытным путём</text>

      <text x="30" y="160" fill="#888" font-family="Geist, sans-serif" font-size="14">Psychology meets practice.</text>
      <text x="30" y="180" fill="#888" font-family="Geist, sans-serif" font-size="14">Coaching, self-work, praxis.</text>

      <text x="30" y="210" fill="#555" font-family="Geist Mono, monospace" font-size="12">~1,500 subscribers</text>

      <text x="350" y="200" fill="#ff6b35" font-family="Geist, sans-serif" font-size="24">→</text>
    </g>

    <!-- Channel 3: Mental Health Tech -->
    <g transform="translate(840, 0)">
      <rect width="400" height="220" fill="none" stroke="#333" stroke-width="1"/>

      <g transform="translate(30, 30)">
        <circle r="24" fill="#ff6b35"/>
        <path d="M-8 2l-4 12c.5 0 .7-.2.9-.5l2.5-2.4 5.2 3.8c1 .5 1.6.3 1.9-.9l3.4-15.5c.3-1.4-.5-2-1.5-1.6l-20 7.7c-1.4.5-1.4 1.3-.2 1.6l5.1 1.6 11.8-7.4c.6-.4 1.1-.2.7.2" fill="#1a1a1f" transform="scale(0.8)"/>
      </g>

      <text x="30" y="100" fill="#fff" font-family="Geist, sans-serif" font-weight="700" font-size="24">@mentalhealthtech</text>
      <text x="30" y="125" fill="#ff6b35" font-family="Geist Mono, monospace" font-size="14">Mental Health Tech</text>

      <text x="30" y="160" fill="#888" font-family="Geist, sans-serif" font-size="14">AI in mental health.</text>
      <text x="30" y="180" fill="#888" font-family="Geist, sans-serif" font-size="14">Startups, research, regulation.</text>

      <text x="30" y="210" fill="#555" font-family="Geist Mono, monospace" font-size="12">~500 subscribers</text>

      <text x="350" y="200" fill="#ff6b35" font-family="Geist, sans-serif" font-size="24">→</text>
    </g>

  </g>

  <!-- Direct contact -->
  <g transform="translate(80, 420)">
    <text fill="#555" font-family="Geist, sans-serif" font-size="14">Direct message:</text>
    <text x="120" fill="#ff6b35" font-family="Geist Mono, monospace" font-size="14">@glebkalinin</text>
    <text x="280" fill="#555" font-family="Geist, sans-serif" font-size="14">· Berlin, Germany</text>
  </g>
</svg>